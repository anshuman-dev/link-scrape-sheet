<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Exporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Tab Exporter</h1>
    <p class="description">Export all open tabs to a new Google Sheet</p>

    <button id="exportBtn" class="export-btn">
      <span class="icon">📊</span>
      Export Tabs to Google Sheet
    </button>

    <div id="status" class="status hidden"></div>

    <div id="result" class="result hidden">
      <p class="success-message">Tabs exported successfully!</p>
      <a id="sheetLink" href="#" target="_blank" class="sheet-link">Open Google Sheet</a>
    </div>

    <div id="error" class="error hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
